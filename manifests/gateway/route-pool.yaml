# The fix: same gateway, same path, the InferencePool as backend. Before Envoy
# forwards a request, it asks the Endpoint Picker (ext_proc) which pod to use.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-pool
  namespace: llm
spec:
  parentRefs:
  - name: inference-gateway
  hostnames:
  - pool.llm.lab
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /v1/
    backendRefs:
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: model-server
    timeouts:
      request: 300s
