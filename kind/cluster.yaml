# kind cluster for the lab: two nodes, so the model servers do not compete
# for CPU with the gateway, the Endpoint Picker and the load generator.
#   infergw-control-plane  lab.infergw/role=platform  (istiod, gateway, EPP, loadgen)
#   infergw-worker         lab.infergw/role=model     (the three model servers)
#
# Node image v1.37.0 pinned by digest: the default image of kind v0.33.0
# (release notes). Istio 1.32 supports Kubernetes 1.33-1.37.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: infergw
nodes:
- role: control-plane
  image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  labels:
    lab.infergw/role: platform
- role: worker
  image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
  labels:
    lab.infergw/role: model
